<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realtime Summarizer</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e4e2dd;
    --accent: #d97706; --rec: #dc2626; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --panel: #202020; --ink: #ececec; --muted: #9a9a9a; --line: #333; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; height: 100vh;
         display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 18px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; }
  label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  select, input[type=text] { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg);
           border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; max-width: 260px; }
  button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
           border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary.stop { background: var(--rec); border-color: var(--rec); }
  .spacer { flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--rec); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px 18px; min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            display: flex; flex-direction: column; min-height: 0; }
  section > .head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  section > .head h2 { font-size: 13px; margin: 0; font-weight: 650; white-space: nowrap; }
  section > .head .meta { color: var(--muted); font-size: 12px; min-width: 0; }
  .body { flex: 1; overflow: auto; padding: 12px 14px; }
  .line { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 3px 0; }
  .line .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
  .line .tr { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
  .line .tr:empty { display: none; }
  #summaryTr { border-top: 1px dashed var(--line); margin-top: 14px; padding-top: 12px; }
  #summaryTr:empty { display: none; }
  .tab { border: 0; background: none; padding: 0; font-size: 13px; font-weight: 650; color: var(--muted); cursor: pointer; }
  .tab.on { color: var(--ink); }
  .dg { padding: 4px 0 10px; }
  .dg + .dg { border-top: 1px solid var(--line); padding-top: 10px; }
  .dg .when { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .dg ul { margin: 4px 0 0; padding-left: 18px; }
  .dg .tr { display: block; color: var(--muted); font-size: 13px; }
  .dg .tr:empty { display: none; }
  .dg .tr.pending { font-style: italic; opacity: .7; }
  #summaryTr h2 { font-size: 14px; margin: 14px 0 6px; }
  #summaryTr h2:first-child { margin-top: 0; }
  #summaryTr ul { margin: 0; padding-left: 18px; }
  #summaryTr p { margin: 6px 0; }
  .empty { color: var(--muted); }
  .settings { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 18px;
              border-bottom: 1px solid var(--line); background: var(--panel); }
  .settings[hidden] { display: none; }
  .live { color: var(--muted); font-style: italic; padding: 2px 0 2px 64px; min-height: 1.4em; }
  .line .tr.pending { font-style: italic; opacity: .7; }
  button { white-space: nowrap; flex-shrink: 0; }
  button:disabled { opacity: .45; cursor: default; }
  #savedNote { color: var(--muted); font-size: 12px; }
  .mic { display: none; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-left: auto; }
  .mic.on { display: inline-flex; }
  .mic .bar { width: 70px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; position: relative; }
  .mic .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--muted); transition: width .15s; }
  .mic.speaking .bar i { background: var(--ok); }
  #conn { display: none; background: var(--rec); color: #fff; font-size: 13px; padding: 7px 14px; }
  #conn.show { display: block; }
  #summary h2 { font-size: 14px; margin: 14px 0 6px; }
  #summary h2:first-child { margin-top: 0; }
  #summary ul { margin: 0; padding-left: 18px; }
  #summary p { margin: 6px 0; }
  .err { color: var(--rec); font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; padding: 0 18px 12px; }
  details { color: var(--muted); font-size: 12px; }
  details input { width: 340px; max-width: 100%; }
</style>
</head>
<body>
<div id="conn">서버와 연결이 끊겼습니다. 다시 연결하는 중… (서버가 꺼졌다면 다시 실행하세요)</div>
<header>
  <h1><span class="dot" id="dot"></span> Realtime Summarizer</h1>
  <div class="spacer"></div>
  <button id="settingsBtn" aria-expanded="false" title="설정 펼치기/접기">설정 ▾</button>
  <button id="save" disabled title="받아적기·번역·요약을 파일로 저장">저장</button>
  <button id="toggle" class="primary">녹음 시작</button>
</header>
<div class="settings" id="settings" hidden>
  <label>마이크 <select id="device"></select></label>
  <label>받아적기 모델 <select id="model"></select></label>
  <label>요약·번역 모델 <select id="provider"></select></label>
  <label>번역 <select id="translate"></select></label>
  <label>요약 주기
    <select id="interval">
      <option value="30">30초</option><option value="60">1분</option><option value="120">2분</option><option value="300">5분</option>
    </select>
  </label>
</div>

<main>
  <section>
    <div class="head"><h2>받아적기</h2><span class="meta" id="tmeta"></span>
      <span class="mic" id="mic"><span class="bar"><i id="micbar"></i></span><span id="micstate">듣는 중</span></span></div>
    <div class="body" id="transcript"><div class="empty">녹음을 시작하면 여기에 실시간으로 받아적습니다.</div></div>
  </section>
  <section>
    <div class="head"><button class="tab on" data-view="full">전체 요약</button><button class="tab" data-view="digest">구간 요약</button>
      <span class="meta" id="smeta"></span><div class="spacer"></div><button id="now">지금 요약</button></div>
    <div class="body" id="sbody">
      <div id="fullView"><div id="summary"><div class="empty">받아적은 내용이 쌓이면 주기마다 요약을 갱신합니다.</div></div>
        <div id="summaryTr"></div></div>
      <div id="digestView" hidden></div>
      <div class="err" id="serr"></div></div>
  </section>
</main>
<div class="note"><span id="savedNote"></span></div>

<script>
const $ = (id) => document.getElementById(id);
let state = null;

function fill(sel, items, current, autoId) {
  sel.innerHTML = "";
  for (const it of items) {
    const o = document.createElement("option");
    o.value = it.id;
    o.textContent = it.name + (autoId && it.id === autoId ? "  · 자동 선택" : "");
    sel.appendChild(o);
  }
  if (current != null) sel.value = current;
}

function renderControls() {
  const c = state.config;
  fill($("device"), state.devices, c.device);
  fill($("model"), state.models, c.model);
  fill($("provider"), state.providers, c.provider, state.auto_provider);
  fill($("translate"), state.languages, c.translate);
  $("interval").value = String(c.interval);
  const rec = state.recording;
  $("toggle").textContent = rec ? "녹음 중지" : "녹음 시작";
  $("toggle").classList.toggle("stop", rec);
  $("dot").classList.toggle("on", rec);
  $("mic").classList.toggle("on", rec);
  if (!rec) { $("micbar").style.width = "0"; $("mic").classList.remove("speaking"); }
  for (const id of ["device", "model"]) $(id).disabled = rec;
  renderSave();
}

function renderSave() {
  const hasContent = (state.lines || []).length > 0 || !!state.summary || (state.digests || []).length > 0;
  $("save").disabled = !hasContent || state.saved;
  $("save").textContent = hasContent && state.saved ? "저장됨" : "저장";
  const files = Object.values(state.saved_files || {}).join("  ·  ");
  $("savedNote").textContent = !hasContent ? ""
    : state.saved ? `저장됨: ${files}`
    : files ? `저장한 뒤로 내용이 더 생겼습니다. 다시 "저장"을 누르면 같은 파일에 덮어씁니다.`
    : `아직 파일로 저장하지 않았습니다 (임시 보관 중). 끝나면 "저장"을 누르세요.`;
}

// 새 줄·번역·요약이 오면 저장 안 된 상태로 표시
function markDirty() {
  if (!state) return;
  state.saved = false;
  renderSave();
}

function addLine(l) {
  const box = $("transcript");
  box.querySelector(".empty")?.remove();
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  const row = document.createElement("div");
  row.className = "line";
  row.dataset.id = l.id;
  row.innerHTML = `<span class="t"></span><span><span class="x"></span><span class="tr"></span></span>`;
  row.querySelector(".t").textContent = l.t;
  row.querySelector(".x").textContent = l.text;
  const tr = row.querySelector(".tr");
  if (l.tr) tr.textContent = l.tr;
  else if (state && state.config.translate !== "off") { tr.textContent = "번역 중…"; tr.classList.add("pending"); }
  const live = box.querySelector(".live");
  box.insertBefore(row, live);
  if (stick) box.scrollTop = box.scrollHeight;
  $("tmeta").textContent = `${box.querySelectorAll(".line").length}줄`;
}

function md(text) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let html = "", inList = false;
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    const li = line.match(/^\s*[-*•]\s+(.*)/);
    if (li) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${esc(li[1])}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    const h = line.match(/^#{1,4}\s+(.*)/);
    if (h) html += `<h2>${esc(h[1])}</h2>`;
    else if (line.trim()) html += `<p>${esc(line)}</p>`;
  }
  if (inList) html += "</ul>";
  return html.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
}

const DIGEST_EMPTY = '<div class="empty">요약 주기마다 그 구간에 나온 말을 1~3줄로 정리합니다.</div>';
const hm = (ts) => new Date(ts * 1000).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });

function addDigest(d) {
  const view = $("digestView"), box = $("sbody");
  view.querySelector(".empty")?.remove();
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  const el = document.createElement("div");
  el.className = "dg";
  el.dataset.id = d.id;
  el.innerHTML = '<div class="when"></div>';
  el.querySelector(".when").textContent = hm(d.start) === hm(d.end) ? hm(d.start) : `${hm(d.start)}–${hm(d.end)}`;
  if (d.bullets && d.bullets.length) {
    const ul = document.createElement("ul");
    d.bullets.forEach((b, i) => {
      const li = document.createElement("li");
      li.textContent = b;
      const tr = document.createElement("span");
      tr.className = "tr";
      if (d.tr && d.tr[i]) tr.textContent = d.tr[i];
      else if (state && state.config.translate !== "off") { tr.textContent = "번역 중…"; tr.classList.add("pending"); }
      li.appendChild(tr);
      ul.appendChild(li);
    });
    el.appendChild(ul);
  } else {
    const p = document.createElement("div");
    p.className = "err";
    p.textContent = `요약하지 못했습니다: ${d.failed || ""}`;
    el.appendChild(p);
  }
  view.appendChild(el);
  if (stick && !view.hidden) box.scrollTop = box.scrollHeight;
}

function setDigestTr(id, tr) {
  document.querySelectorAll(`.dg[data-id="${id}"] li .tr`).forEach((el, i) => {
    el.textContent = tr[i] || "";
    el.classList.remove("pending");
  });
}

function setView(view) {
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
  $("fullView").hidden = view !== "full";
  $("digestView").hidden = view !== "digest";
  try { localStorage.setItem("summarizer-summary-view", view); } catch (e) {}
}
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
try { setView(localStorage.getItem("summarizer-summary-view") === "digest" ? "digest" : "full"); } catch (e) { setView("full"); }

function setSummary(text, at) {
  $("summary").innerHTML = text ? md(text) : '<div class="empty">받아적은 내용이 쌓이면 주기마다 요약을 갱신합니다.</div>';
  if (at) $("smeta").textContent = `${new Date(at * 1000).toLocaleTimeString("ko-KR")} 갱신`;
}

async function load() {
  state = await (await fetch("/api/state")).json();
  renderControls();
  $("transcript").innerHTML = state.lines.length ? ""
    : state.recording ? '<div class="empty">듣는 중…</div>'
    : '<div class="empty">녹음을 시작하면 여기에 실시간으로 받아적습니다.</div>';
  if (!$("transcript").querySelector(".live")) $("transcript").insertAdjacentHTML("beforeend", '<div class="live"></div>');
  state.lines.forEach(addLine);
  setSummary(state.summary, state.summary_at);
  $("summaryTr").innerHTML = state.summary_tr ? md(state.summary_tr) : "";
  $("digestView").innerHTML = DIGEST_EMPTY;
  (state.digests || []).forEach(addDigest);
  $("serr").textContent = state.summary_error || "";
}

async function post(path, body) {
  let j;
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    j = await r.json();
  } catch (e) {
    $("conn").classList.add("show");
    alert("서버에 연결할 수 없습니다. 서버가 켜져 있는지 확인하세요.");
    return null;
  }
  if (j.error) { alert(j.error); return null; }
  state = j; renderControls();
  return j;
}

for (const id of ["device", "model", "provider", "interval", "translate"]) {
  $(id).addEventListener("change", () => post("/api/config", { [id]: id === "interval" ? Number($(id).value) : $(id).value }));
}
function setSettingsOpen(open, refresh) {
  $("settings").hidden = !open;
  $("settingsBtn").textContent = open ? "설정 ▴" : "설정 ▾";
  $("settingsBtn").setAttribute("aria-expanded", String(open));
  try { localStorage.setItem("summarizer-settings-open", open ? "1" : "0"); } catch (e) {}
  if (open && refresh && state && !state.recording) post("/api/refresh");  // 새로 꽂은 마이크·새로 깐 CLI도 보이게
}
$("settingsBtn").addEventListener("click", () => setSettingsOpen($("settings").hidden, true));
try { setSettingsOpen(localStorage.getItem("summarizer-settings-open") === "1", false); } catch (e) { setSettingsOpen(false, false); }
$("save").addEventListener("click", async () => { await post("/api/save"); });
$("now").addEventListener("click", () => post("/api/summarize"));
$("toggle").addEventListener("click", async () => {
  if (!state) return;
  if (state.recording) return post("/api/stop");
  const unsaved = ((state.lines || []).length > 0 || state.summary) && !state.saved;
  if (unsaved && !confirm("저장하지 않은 받아적기가 있습니다. 버리고 새로 녹음할까요?")) return;
  const j = await post("/api/start");
  if (!j || !j.recording) return;  // 시작 실패면 '듣는 중'을 띄우지 않는다
  $("transcript").innerHTML = '<div class="empty">듣는 중…</div><div class="live"></div>';
  setSummary("", 0); $("summaryTr").innerHTML = ""; $("digestView").innerHTML = DIGEST_EMPTY; $("smeta").textContent = ""; $("tmeta").textContent = ""; $("serr").textContent = "";
});

// 서버 이벤트 구독 (채널 셋을 연결 하나로): 끊기면 배너, 다시 붙으면 전체 상태를 새로 불러온다 (재시작한 서버와 화면이 어긋나지 않게)
function subscribe(path, onEvent) {
  const es = new EventSource(path);
  let opened = false;
  es.onopen = () => {
    $("conn").classList.remove("show");
    if (opened) load();
    opened = true;
  };
  es.onerror = () => { if (es.readyState !== EventSource.OPEN) $("conn").classList.add("show"); };
  es.onmessage = (e) => onEvent(JSON.parse(e.data));
}

function onTranscript(ev) {
  if (ev.type === "line") { addLine(ev); state?.lines.push(ev); markDirty(); }
  if (ev.type === "partial") {
    const box = $("transcript");
    let live = box.querySelector(".live");
    if (!live) { live = document.createElement("div"); live.className = "live"; box.appendChild(live); }
    if (ev.text && box.querySelector(".empty")) box.querySelector(".empty").remove();
    const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
    live.textContent = ev.text || "";
    if (stick) box.scrollTop = box.scrollHeight;
  }
  if (ev.type === "translation") {
    const el = document.querySelector(`.line[data-id="${ev.id}"] .tr`);
    if (el) { el.textContent = ev.text; el.classList.remove("pending"); }
    markDirty();
  }
  if (ev.type === "reset_translations") document.querySelectorAll(".line .tr, .dg li .tr").forEach((el) => {
    const on = ev.lang && ev.lang !== "off";
    el.textContent = on ? "번역 중…" : "";
    el.classList.toggle("pending", on);
  });
  if (ev.type === "error") {
    $("serr").textContent = ev.message;
    document.querySelectorAll(".line .tr.pending").forEach((el) => { el.textContent = ""; el.classList.remove("pending"); });
  }
}
function onSummary(ev) {
  if (ev.type === "working") $("smeta").textContent = "요약 중…";
  if (ev.type === "summary") {
    setSummary(ev.text, ev.at); $("serr").textContent = "";
    if (state) state.summary = ev.text;
    markDirty();
  }
  if (ev.type === "summary_tr") { $("summaryTr").innerHTML = md(ev.text); markDirty(); }
  if (ev.type === "digest") { addDigest(ev); state?.digests.push(ev); markDirty(); }
  if (ev.type === "digest_tr") {
    setDigestTr(ev.id, ev.tr);
    const d = state?.digests.find((x) => x.id === ev.id);
    if (d) d.tr = ev.tr;
    markDirty();
  }
  if (ev.type === "error") {
    $("serr").textContent = ev.message; $("smeta").textContent = "";
    document.querySelectorAll(".dg .tr.pending").forEach((el) => { el.textContent = ""; el.classList.remove("pending"); });
  }
}
let sttBusy = false;
async function onStatus(ev) {
  if (ev.type === "level") {
    $("micbar").style.width = Math.min(100, Math.round((ev.level / Math.max(1, ev.threshold * 2)) * 100)) + "%";
    $("mic").classList.toggle("speaking", ev.speaking);
    $("micstate").textContent = sttBusy ? "받아쓰는 중…" : ev.speaking ? "말소리 감지" : "듣는 중";
    return;
  }
  if (ev.type === "stt") { sttBusy = ev.busy; if (sttBusy) $("micstate").textContent = "받아쓰는 중…"; return; }
  if (ev.type === "error") alert(ev.message);
  if (ev.type === "notice") { $("tmeta").textContent = ev.message; return; }
  state = await (await fetch("/api/state")).json();
  renderControls();
}
const HANDLERS = { transcript: onTranscript, summary: onSummary, status: onStatus };
subscribe("/events", (ev) => HANDLERS[ev.ch]?.(ev));

load();
</script>
</body>
</html>
